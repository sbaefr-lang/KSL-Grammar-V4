<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>의사소통 한국어 1과 문법을 배워요</title>

<meta property="og:title" content="의사소통 한국어 1과 문법을 배워요">
<meta property="og:description" content="네가 이렇게 꼼꼼히 공부하고 있는 줄 몰랐어 - 문법 4개를 인터랙티브로 배워요">
<meta property="og:image" content="https://sbaefr-lang.github.io/KSL-Grammar-V2/assets/banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://sbaefr-lang.github.io/KSL-Grammar-V2/assets/banner.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Jua&display=swap" rel="stylesheet">

<style>
:root{
  --purple-main:#8b6fc9;
  --purple-dark:#5a3d99;
  --bg:#f7f4fc;
  --card-bg:#efe7fa;
  --ink:#2c3438;
  --border:#ded0f0;
  --ga-bg:#ece4fb;
  --ga-border:#cdb8ec;
  --na-bg:#f8ecf7;
  --na-border:#e3b9dc;
  --highlight:#fff1a6;
  --red:#d1495b;
  --white:#ffffff;
  --more-main:#e2a154;
  --more-bg:#fdf1e0;
  --more-dark:#8a5a1e;
  --more-border:#f0d9b0;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  background-image:radial-gradient(circle at 1px 1px, #e6dbf6 1px, transparent 0);
  background-size:22px 22px;
  font-family:'Gothic A1',sans-serif;
  color:var(--ink);
  padding-bottom:90px;
}
.jua{font-family:'Jua',sans-serif;}

/* 타이틀 */
.page-title{
  text-align:center;
  font-size:15px;
  font-weight:700;
  color:#000;
  padding:14px 10px 6px;
}

/* 상단 문법 탭 (책갈피) */
.gram-tabs{
  display:flex;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:0 8px;
  gap:5px;
}
.gram-tabs::-webkit-scrollbar{display:none;}
.gram-tab{
  flex:0 0 auto;
  padding:12px 16px;
  min-height:44px;
  display:flex;
  align-items:center;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  background:var(--purple-main);
  color:#fff;
  border:1px solid var(--purple-main);
  border-radius:14px 14px 0 0;
  cursor:pointer;
  transition:.15s;
}
.gram-tab.active{
  background:var(--card-bg);
  color:var(--purple-dark);
  border-color:var(--border);
}
/* 더 배워요 탭 (다른 색상으로 구분) */
.gram-tab.more{
  background:var(--more-main);
  border-color:var(--more-main);
}
.gram-tab.more.active{
  background:var(--more-bg);
  color:var(--more-dark);
  border-color:var(--more-border);
}

/* 하위 단계 탭 */
.step-tabs{
  display:flex;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  gap:6px;
  padding:10px 10px 0;
  background:var(--card-bg);
}
.step-tabs::-webkit-scrollbar{display:none;}
.step-tab{
  flex:0 0 auto;
  padding:9px 13px;
  min-height:40px;
  display:flex;
  align-items:center;
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
  background:#fff;
  color:#000;
  border:1px solid var(--border);
  border-radius:8px 8px 0 0;
  cursor:pointer;
}
.step-tab.active{
  background:#242229;
  color:#fff;
  border-color:#242229;
}

.progress{
  text-align:center;
  font-size:12px;
  color:var(--purple-dark);
  font-weight:700;
  background:var(--card-bg);
  padding:4px 0 10px;
}

/* 컨텐츠 영역 */
.stage{
  background:var(--card-bg);
  padding:16px 14px 26px;
  border-radius:0 0 14px 14px;
  margin:0 6px 20px;
}
.panel{display:none;animation:fade .25s;}
.panel.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.grammar-title-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:14px;
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.grammar-title-box .main{
  font-size:20px;
  font-weight:800;
  color:var(--purple-dark);
}
.grammar-title-box .sub{
  font-size:13px;
  color:#6b6b6b;
  font-weight:500;
}

/* 1. 상황 도입 - 대화 */
.dialogue{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.bubble-row{display:flex;}
.bubble-row.ga{justify-content:flex-start;}
.bubble-row.na{justify-content:flex-end;}
.bubble{
  max-width:82%;
  padding:11px 14px;
  border-radius:16px;
  font-size:14.5px;
  line-height:1.5;
  color:#000;
  font-weight:500;
}
.bubble-row.ga .bubble{background:var(--ga-bg);border:1px solid var(--ga-border);border-bottom-left-radius:4px;}
.bubble-row.na .bubble{background:var(--na-bg);border:1px solid var(--na-border);border-bottom-right-radius:4px;}
.bubble mark{
  background:var(--highlight);
  font-weight:800;
  padding:0 2px;
  border-radius:3px;
}
.intro-hint{
  display:flex;
  align-items:center;
  gap:6px;
  justify-content:center;
  background:#fff;
  border:1.5px solid var(--purple-main);
  border-radius:999px;
  padding:10px 16px;
  font-size:13.5px;
  font-weight:600;
  margin-top:6px;
  flex-wrap:wrap;
  text-align:center;
}
.chip{
  background:var(--purple-dark);
  color:#fff;
  padding:2px 10px;
  border-radius:999px;
  font-weight:800;
  font-size:13px;
}

/* 2. 의미 */
.ex-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
  position:relative;
}
.ex-tag{
  display:inline-block;
  background:var(--card-bg);
  color:var(--purple-dark);
  border:1px solid var(--border);
  font-size:11.5px;
  font-weight:700;
  padding:3px 10px;
  border-radius:999px;
  margin-bottom:8px;
}
.ex-box p{margin:0;font-size:14.5px;line-height:1.6;}
.ex-box b{color:var(--purple-dark);font-weight:800;}
.summary-box{
  background:var(--card-bg);
  border-radius:10px;
  padding:12px 14px;
  font-size:14px;
  font-weight:700;
  color:var(--purple-dark);
  margin-top:14px;
}

/* 3. 형태 표 */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--border);}
table.form-table{width:100%;border-collapse:collapse;background:#fff;min-width:480px;}
table.form-table th{
  background:var(--purple-main);
  color:#fff;
  font-size:13.5px;
  padding:10px 8px;
  text-align:left;
  white-space:nowrap;
}
table.form-table td{
  padding:12px 10px;
  font-size:14px;
  border-top:1px solid var(--border);
  vertical-align:top;
}
table.form-table td.form-col{color:#000;font-weight:700;}
table.form-table b.red{color:var(--red);font-weight:800;}

/* 4,5. 연습 리스트 */
.hint-bar{
  background:var(--card-bg);
  color:var(--purple-dark);
  font-weight:700;
  font-size:13.5px;
  padding:10px 14px;
  border-radius:10px;
  margin-bottom:12px;
}
.example-box{
  background:var(--card-bg);
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  font-size:14.5px;
  font-weight:700;
  line-height:1.6;
  position:relative;
  padding-top:30px;
}
.example-box .tag-bogi{
  position:absolute;
  top:-10px;left:14px;
  background:#fff;
  border:1px solid var(--border);
  padding:3px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  color:var(--purple-dark);
}
.practice-item{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.practice-item .q{font-size:14.5px;font-weight:600;flex:1;min-width:150px;}
.practice-item .q .answer-text{
  display:none;
  color:var(--purple-dark);
  font-weight:800;
  margin-left:4px;
}
.practice-item.revealed .q .answer-text{display:inline;}
.btn-answer{
  background:var(--purple-main);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:10px 16px;
  font-size:13.5px;
  font-weight:700;
  min-height:44px;
  cursor:pointer;
  white-space:nowrap;
}
.practice-item.revealed .btn-answer{background:var(--card-bg);color:var(--purple-dark);}
.btn-retry{
  display:block;
  width:100%;
  background:#fff;
  border:1.5px solid #000;
  color:#000;
  border-radius:10px;
  padding:12px;
  font-size:14px;
  font-weight:700;
  min-height:44px;
  cursor:pointer;
  margin-top:6px;
}
.talk-more{
  margin-top:16px;
  background:var(--card-bg);
  border-radius:12px;
  padding:14px;
  font-size:13.5px;
  font-weight:700;
  color:var(--purple-dark);
  text-align:center;
  line-height:1.6;
}

/* 6. 사용 시 주의점 */
.warning-box{
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:13px 14px;
  margin-bottom:10px;
  font-size:14px;
  font-weight:700;
  line-height:1.6;
}
.warning-box .ex{
  margin-top:8px;
  background:var(--card-bg);
  border-radius:8px;
  padding:8px 10px;
  font-size:13px;
  font-weight:600;
  color:var(--purple-dark);
}
.warning-box .ex b{color:var(--red);font-weight:800;}

/* 7. 비교문법 */
.compare-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
}
.compare-box h4{margin:0 0 8px;color:var(--purple-dark);font-size:15px;}
.compare-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.compare-table th{background:var(--card-bg);color:var(--purple-dark);padding:8px;text-align:left;}
.compare-table td{padding:8px;border-top:1px solid var(--border);}

/* 이전/다음 */
.nav-buttons{
  display:flex;
  gap:10px;
  padding:0 12px;
  margin-top:6px;
}
.nav-btn{
  flex:1;
  background:#fff;
  border:1.5px solid #d8cfc2;
  color:#000;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
  min-height:44px;
  cursor:pointer;
}
.nav-btn:disabled{opacity:.35;cursor:default;}

@media (min-width:640px){
  .stage{margin:0 20px 20px;padding:22px;}
  .nav-buttons{padding:0 20px;}
}
</style>
</head>
<body>

<div class="page-title">의사소통 한국어 1과 문법을 배워요</div>

<div class="gram-tabs" id="gramTabs"></div>
<div class="step-tabs" id="stepTabs"></div>
<div class="progress" id="progressLabel"></div>

<div class="stage" id="stage"></div>

<div class="nav-buttons">
  <button class="nav-btn" id="prevBtn">← 이전</button>
  <button class="nav-btn" id="nextBtn">다음 →</button>
</div>

<script>
const STEP_NAMES = ["상황 도입","의미","형태","형태 연습","문장 연습","사용 시 주의점","비교 문법"];

const grammarData = [
{
  tabLabel:"①A/V-어서 그런지",
  title:"-어서 그런지",
  sub:"-아서 그런지, -여서 그런지",
  dialogue:[
    {s:"ga", t:"① 무슨 참고서 살지 결정했어?"},
    {s:"na", t:"② 이걸 사려고. 내용도 좋고 디자인도 깔끔해서 좋은 것 같아."},
    {s:"ga", t:"③ 응, 깔끔한 건 좋은데 그림이 별로 없<mark>어서 그런지</mark> 좀 재미없어 보여."},
    {s:"na", t:"④ 그래? 난 그림이 많으면 오히려 집중이 안되던데."}
  ],
  meaning:{
    textbook:"저녁을 짜게 먹<b>어서 그런지</b> 계속 목이 말라요.",
    daily:"오늘따라 길이 많이 막히네. 사고가 나<b>서 그런지</b> 차가 안 움직여.",
    summary:"✅ 뒤 내용의 원인·이유일 것 같다고 추측할 때 쓰는 표현이에요."
  },
  forms:[
    {cond:"끝음절 모음이 ㅏ, ㅗ", form:"-아서 그런지", ex:"좋다 → 좋<b class='red'>아서 그런지</b>"},
    {cond:"끝음절 모음이 ㅏ, ㅗ 이외", form:"-어서 그런지", ex:"먹다 → 먹<b class='red'>어서 그런지</b>"},
    {cond:"하다", form:"-여서 그런지 (해서 그런지)", ex:"피곤하다 → 피곤<b class='red'>해서 그런지</b>"}
  ],
  formPractice:[
    {word:"힘들다", answer:"힘들어서 그런지"},
    {word:"바쁘다", answer:"바빠서 그런지"},
    {word:"늦다", answer:"늦어서 그런지"},
    {word:"편하다", answer:"편해서 그런지"},
    {word:"어렵다", answer:"어려워서 그런지"}
  ],
  sentenceExample:"렌즈를 오래 껴서 그런지 눈이 너무 건조해요. (렌즈를 오래 끼다)",
  sentencePractice:[
    {q:"(마음이 불편하다) 잠이 오지 않아요.", answer:"마음이 불편해서 그런지"},
    {q:"(일교차가 크다) 감기에 걸린 친구들이 많은 것 같아요.", answer:"일교차가 커서 그런지"}
  ],
  talkMore:"가장 어려운 과목이 뭐예요? 왜 그 과목이 어려운 것 같아요?<br>'-어서 그런지'를 사용하여 말해 보세요.",
  warnings:[
    {t:"⚠️ 뒤에는 확실한 사실보다 화자가 추측한 내용이 와요. 확실한 이유를 말할 때는 '-어서'를 써요.",
     ex:"예) 배가 아<b>파서 그런지</b> 밥맛이 없어요. (확실하지 않고 그런 것 같다는 추측)"},
    {t:"⚠️ '-어서 그런지' 뒤에는 명령문이나 청유문을 쓸 수 없어요.",
     ex:"예) 머리가 아파서 그런지 좀 쉬세요. (X) → 머리가 아프니까 좀 쉬세요. (O)"},
    {t:"⚠️ 이유가 정확하지 않을 때 쓰는 표현이므로 '반드시 그 이유이다'라고 단정할 때는 쓰지 않아요.",
     ex:"예) 시험을 못 <b>봐서 그런지</b> 기분이 안 좋아 보여요. (다른 이유일 수도 있음)"}
  ],
  compareTitle:"'-어서 그런지' vs '-어서'",
  compareRows:[
    ["의미","이유일 것 같다고 추측함","이유를 확실하게 말함"],
    ["예문1","길이 막혀서 그런지 늦네요. (추측)","길이 막혀서 늦었어요. (확실한 이유)"],
    ["예문2","오늘따라 피곤해서 그런지 자꾸 하품이 나요.","숙제를 안 해서 선생님께 혼났어요."],
    ["제약","명령문·청유문 불가","경우에 따라 제약 있음"]
  ],
  compareHead:["구분","-어서 그런지","-어서"]
},
{
  tabLabel:"②V/N-는 줄 알다/모르다",
  title:"-는 줄 알다/모르다",
  sub:"-ㄴ 줄, -은 줄, -ㄹ 줄, -을 줄",
  dialogue:[
    {s:"ga", t:"① 수호야, 뭐 해?"},
    {s:"na", t:"② 수학 오답 노트 정리하고 있어. 이렇게 하나하나 틀린 걸 정리해 놓으면 공부하는 데 도움이 돼."},
    {s:"ga", t:"③ 와, 네가 이렇게 꼼꼼히 공부하고 있는 <mark>줄 몰랐어</mark>. 나도 한번 해 봐야겠다. 네가 정리해 놓은 거 자세히 봐도 될까?"},
    {s:"na", t:"④ 물론이지. 잠깐만 기다려. 이 문제까지 다 쓰고 보여 줄게."}
  ],
  meaning:{
    textbook:"체험 행사에 참여하려면 미리 신청해야 하는 <b>줄 몰랐어</b>.",
    daily:"저 친구가 우리 학교에 다니는 <b>줄 몰랐어요</b>. 오늘 처음 알았어요.",
    summary:"✅ 어떤 사실이나 상태에 대해 알고 있거나 모르고 있음을 나타내는 표현이에요."
  },
  forms:[
    {cond:"동사 현재", form:"-는 줄", ex:"가다 → 가<b class='red'>는 줄</b>"},
    {cond:"동사 과거", form:"-(으)ㄴ 줄", ex:"가다 → 간 줄 / 먹다 → 먹<b class='red'>은 줄</b>"},
    {cond:"형용사·이다 현재", form:"-(으)ㄴ 줄", ex:"좋다 → 좋<b class='red'>은 줄</b> / 학생이다 → 학생<b class='red'>인 줄</b>"},
    {cond:"동사·형용사 미래·추측", form:"-(으)ㄹ 줄", ex:"가다 → 갈 줄 / 좋다 → 좋<b class='red'>을 줄</b>"}
  ],
  formPractice:[
    {word:"어렵다", answer:"어려운 줄"},
    {word:"다르다", answer:"다른 줄"},
    {word:"오다", answer:"오는 줄"},
    {word:"유명하다", answer:"유명한 줄"},
    {word:"끝나다", answer:"끝나는 줄"}
  ],
  sentenceExample:"가: 우리 팀이 우승했다는 게 사실이야? 믿어지지가 않아.<br>나: 나도. 우리 팀이 이렇게 잘하는 줄 몰랐어. (잘하다)",
  sentencePractice:[
    {q:"(뛰어나다) 나도. 우리 팀이 이렇게", answer:"뛰어난 줄 몰랐어"},
    {q:"(실력이 좋다) 나도. 우리 팀이 이렇게", answer:"실력이 좋은 줄 몰랐어"}
  ],
  talkMore:"어떤 일을 어떻게 해야 하는지 알아요? 몰라요?<br>'-는 줄 알다'와 '-는 줄 모르다'를 사용하여 말해 보세요.",

let curGram = 0, curStep = 0;

function renderGramTabs(){
  const wrap = document.getElementById('gramTabs');
  wrap.innerHTML = grammarData.map((g,i)=>
    `<div class="gram-tab ${g.isMore?'more':''} ${i===curGram?'active':''}" data-i="${i}">${g.tabLabel}</div>`
  ).join('');
  wrap.querySelectorAll('.gram-tab').forEach(el=>{
    el.addEventListener('click', ()=>{ curGram = +el.dataset.i; curStep = 0; renderAll(); });
  });
  const active = wrap.querySelector('.gram-tab.active');
  if(active) active.scrollIntoView({inline:'center', behavior:'smooth', block:'nearest'});
}

function renderStepTabs(){
  const wrap = document.getElementById('stepTabs');
  wrap.innerHTML = STEP_NAMES.map((n,i)=>
    `<div class="step-tab ${i===curStep?'active':''}" data-i="${i}">${i+1}. ${n}</div>`
  ).join('');
  wrap.querySelectorAll('.step-tab').forEach(el=>{
    el.addEventListener('click', ()=>{ curStep = +el.dataset.i; renderAll(); });
  });
  const active = wrap.querySelector('.step-tab.active');
  if(active) active.scrollIntoView({inline:'center', behavior:'smooth', block:'nearest'});
}

function renderProgress(){
  document.getElementById('progressLabel').textContent = `문법 ${curGram+1} · ${curStep+1}/7`;
}

function practiceListHTML(items){
  return items.map((it,idx)=>`
    <div class="practice-item" data-idx="${idx}">
      <div class="q">${it.word ? it.word : it.q} <span class="answer-text">→ ${it.answer}</span></div>
      <button class="btn-answer">정답 보기</button>
    </div>
  `).join('') + `<button class="btn-retry">다시 풀기</button>`;
}

function renderStage(){
  const g = grammarData[curGram];
  const stage = document.getElementById('stage');
  let html = `<div class="grammar-title-box"><span class="main jua">${g.title}</span><span class="sub">${g.sub}</span></div>`;

  if(curStep===0){
    html += `<div class="dialogue">` + g.dialogue.map(d=>
      `<div class="bubble-row ${d.s}"><div class="bubble">${d.t}</div></div>`
    ).join('') + `</div>`;
    html += `<div class="intro-hint">💡 <span class="chip">${g.title}</span>가 어디에 쓰였는지 찾아보세요!</div>`;
  }
  else if(curStep===1){
    html += `<div class="ex-box"><span class="ex-tag">교재 예문</span><p>${g.meaning.textbook}</p></div>`;
    html += `<div class="ex-box"><span class="ex-tag">일상 예문</span><p>${g.meaning.daily}</p></div>`;
    html += `<div class="summary-box">${g.meaning.summary}</div>`;
  }
  else if(curStep===2){
    html += `<div class="table-wrap"><table class="form-table"><tr><th>조건</th><th>형태</th><th>예시</th></tr>`
      + g.forms.map(f=>`<tr><td>${f.cond}</td><td class="form-col">${f.form}</td><td>${f.ex}</td></tr>`).join('')
      + `</table></div>`;
  }
  else if(curStep===3){
    html += `<div class="hint-bar">💡 단어를 클릭하면 답이 나타나요.</div>`;
    html += practiceListHTML(g.formPractice);
  }
  else if(curStep===4){
    html += `<div class="example-box"><span class="tag-bogi">보기</span>${g.sentenceExample}</div>`;
    html += practiceListHTML(g.sentencePractice);
    html += `<div class="talk-more">${g.talkMore}</div>`;
  }
  else if(curStep===5){
    html += g.warnings.map(w=>`<div class="warning-box">${w.t}<div class="ex">${w.ex}</div></div>`).join('');
  }
  else if(curStep===6){
    html += `<div class="compare-box"><h4>${g.compareTitle}</h4>
      <table class="compare-table"><tr>${g.compareHead.map(h=>`<th>${h}</th>`).join('')}</tr>
      ${g.compareRows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
      </table></div>`;
  }

  stage.innerHTML = html;

  stage.querySelectorAll('.btn-answer').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.closest('.practice-item').classList.add('revealed');
    });
  });
  const retry = stage.querySelector('.btn-retry');
  if(retry){
    retry.addEventListener('click', ()=>{
      stage.querySelectorAll('.practice-item').forEach(it=>it.classList.remove('revealed'));
    });
  }
}

function renderNav(){
  document.getElementById('prevBtn').disabled = (curGram===0 && curStep===0);
  document.getElementById('nextBtn').disabled = (curGram===grammarData.length-1 && curStep===6);
}

function renderAll(){
  renderGramTabs();
  renderStepTabs();
  renderProgress();
  renderStage();
  renderNav();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(curStep>0){ curStep--; }
  else if(curGram>0){ curGram--; curStep=6; }
  renderAll();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(curStep<6){ curStep++; }
  else if(curGram<grammarData.length-1){ curGram++; curStep=0; }
  renderAll();
});

renderAll();
</script>
</body>
</html>
