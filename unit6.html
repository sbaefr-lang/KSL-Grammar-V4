<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>의사소통 한국어 6과 문법을 배워요</title>

<meta property="og:title" content="의사소통 한국어 6과 문법을 배워요">
<meta property="og:description" content="글도 잘 쓰는 데다가 상상력도 풍부하니까 훌륭한 작가가 될 거야 - 문법 6개를 인터랙티브로 배워요">
<meta property="og:image" content="https://sbaefr-lang.github.io/KSL-Grammar-V2/assets/banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://sbaefr-lang.github.io/KSL-Grammar-V2/assets/banner.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Jua&display=swap" rel="stylesheet">

<style>
:root{
  --purple-main:#8b6fc9;
  --purple-dark:#5a3d99;
  --bg:#f7f4fc;
  --card-bg:#efe7fa;
  --ink:#2c3438;
  --border:#ded0f0;
  --ga-bg:#ece4fb;
  --ga-border:#cdb8ec;
  --na-bg:#f8ecf7;
  --na-border:#e3b9dc;
  --highlight:#fff1a6;
  --red:#d1495b;
  --white:#ffffff;
  --more-main:#e2a154;
  --more-bg:#fdf1e0;
  --more-dark:#8a5a1e;
  --more-border:#f0d9b0;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  background-image:radial-gradient(circle at 1px 1px, #e6dbf6 1px, transparent 0);
  background-size:22px 22px;
  font-family:'Gothic A1',sans-serif;
  color:var(--ink);
  padding-bottom:90px;
}
.jua{font-family:'Jua',sans-serif;}

/* 타이틀 */
.page-title{
  text-align:center;
  font-size:15px;
  font-weight:700;
  color:#000;
  padding:14px 10px 6px;
}

/* 상단 문법 탭 (책갈피) */
.gram-tabs{
  display:flex;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:0 8px;
  gap:5px;
}
.gram-tabs::-webkit-scrollbar{display:none;}
.gram-tab{
  flex:0 0 auto;
  padding:12px 16px;
  min-height:44px;
  display:flex;
  align-items:center;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  background:var(--purple-main);
  color:#fff;
  border:1px solid var(--purple-main);
  border-radius:14px 14px 0 0;
  cursor:pointer;
  transition:.15s;
}
.gram-tab.active{
  background:var(--card-bg);
  color:var(--purple-dark);
  border-color:var(--border);
}
/* 더 배워요 탭 (다른 색상으로 구분) */
.gram-tab.more{
  background:var(--more-main);
  border-color:var(--more-main);
}
.gram-tab.more.active{
  background:var(--more-bg);
  color:var(--more-dark);
  border-color:var(--more-border);
}

/* 하위 단계 탭 */
.step-tabs{
  display:flex;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  gap:6px;
  padding:10px 10px 0;
  background:var(--card-bg);
}
.step-tabs::-webkit-scrollbar{display:none;}
.step-tab{
  flex:0 0 auto;
  padding:9px 13px;
  min-height:40px;
  display:flex;
  align-items:center;
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
  background:#fff;
  color:#000;
  border:1px solid var(--border);
  border-radius:8px 8px 0 0;
  cursor:pointer;
}
.step-tab.active{
  background:#242229;
  color:#fff;
  border-color:#242229;
}

.progress{
  text-align:center;
  font-size:12px;
  color:var(--purple-dark);
  font-weight:700;
  background:var(--card-bg);
  padding:4px 0 10px;
}

/* 컨텐츠 영역 */
.stage{
  background:var(--card-bg);
  padding:16px 14px 26px;
  border-radius:0 0 14px 14px;
  margin:0 6px 20px;
}
.panel{display:none;animation:fade .25s;}
.panel.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.grammar-title-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:14px;
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.grammar-title-box .main{
  font-size:20px;
  font-weight:800;
  color:var(--purple-dark);
}
.grammar-title-box .sub{
  font-size:13px;
  color:#6b6b6b;
  font-weight:500;
}

/* 1. 상황 도입 - 대화 */
.dialogue{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.bubble-row{display:flex;}
.bubble-row.ga{justify-content:flex-start;}
.bubble-row.na{justify-content:flex-end;}
.bubble{
  max-width:82%;
  padding:11px 14px;
  border-radius:16px;
  font-size:14.5px;
  line-height:1.5;
  color:#000;
  font-weight:500;
}
.bubble-row.ga .bubble{background:var(--ga-bg);border:1px solid var(--ga-border);border-bottom-left-radius:4px;}
.bubble-row.na .bubble{background:var(--na-bg);border:1px solid var(--na-border);border-bottom-right-radius:4px;}
.bubble mark{
  background:var(--highlight);
  font-weight:800;
  padding:0 2px;
  border-radius:3px;
}
.intro-hint{
  display:flex;
  align-items:center;
  gap:6px;
  justify-content:center;
  background:#fff;
  border:1.5px solid var(--purple-main);
  border-radius:999px;
  padding:10px 16px;
  font-size:13.5px;
  font-weight:600;
  margin-top:6px;
  flex-wrap:wrap;
  text-align:center;
}
.chip{
  background:var(--purple-dark);
  color:#fff;
  padding:2px 10px;
  border-radius:999px;
  font-weight:800;
  font-size:13px;
}

/* 2. 의미 */
.ex-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
  position:relative;
}
.ex-tag{
  display:inline-block;
  background:var(--card-bg);
  color:var(--purple-dark);
  border:1px solid var(--border);
  font-size:11.5px;
  font-weight:700;
  padding:3px 10px;
  border-radius:999px;
  margin-bottom:8px;
}
.ex-box p{margin:0;font-size:14.5px;line-height:1.6;}
.ex-box b{color:var(--purple-dark);font-weight:800;}
.summary-box{
  background:var(--card-bg);
  border-radius:10px;
  padding:12px 14px;
  font-size:14px;
  font-weight:700;
  color:var(--purple-dark);
  margin-top:14px;
}

/* 3. 형태 표 */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--border);}
table.form-table{width:100%;border-collapse:collapse;background:#fff;min-width:480px;}
table.form-table th{
  background:var(--purple-main);
  color:#fff;
  font-size:13.5px;
  padding:10px 8px;
  text-align:left;
  white-space:nowrap;
}
table.form-table td{
  padding:12px 10px;
  font-size:14px;
  border-top:1px solid var(--border);
  vertical-align:top;
}
table.form-table td.form-col{color:#000;font-weight:700;}
table.form-table b.red{color:var(--red);font-weight:800;}

/* 4,5. 연습 리스트 */
.hint-bar{
  background:var(--card-bg);
  color:var(--purple-dark);
  font-weight:700;
  font-size:13.5px;
  padding:10px 14px;
  border-radius:10px;
  margin-bottom:12px;
}
.example-box{
  background:var(--card-bg);
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  font-size:14.5px;
  font-weight:700;
  line-height:1.6;
  position:relative;
  padding-top:30px;
}
.example-box .tag-bogi{
  position:absolute;
  top:-10px;left:14px;
  background:#fff;
  border:1px solid var(--border);
  padding:3px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  color:var(--purple-dark);
}
.practice-item{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.practice-item .q{font-size:14.5px;font-weight:600;flex:1;min-width:150px;}
.practice-item .q .answer-text{
  display:none;
  color:var(--purple-dark);
  font-weight:800;
  margin-left:4px;
}
.practice-item.revealed .q .answer-text{display:inline;}
.btn-answer{
  background:var(--purple-main);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:10px 16px;
  font-size:13.5px;
  font-weight:700;
  min-height:44px;
  cursor:pointer;
  white-space:nowrap;
}
.practice-item.revealed .btn-answer{background:var(--card-bg);color:var(--purple-dark);}
.btn-retry{
  display:block;
  width:100%;
  background:#fff;
  border:1.5px solid #000;
  color:#000;
  border-radius:10px;
  padding:12px;
  font-size:14px;
  font-weight:700;
  min-height:44px;
  cursor:pointer;
  margin-top:6px;
}
.talk-more{
  margin-top:16px;
  background:var(--card-bg);
  border-radius:12px;
  padding:14px;
  font-size:13.5px;
  font-weight:700;
  color:var(--purple-dark);
  text-align:center;
  line-height:1.6;
}
.talk-more-page{
  margin-top:4px;
  background:var(--card-bg);
  border-radius:14px;
  padding:22px 18px;
  font-size:15px;
  font-weight:700;
  color:var(--purple-dark);
  text-align:center;
  line-height:1.8;
}

/* 6. 사용 시 주의점 */
.warning-box{
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:13px 14px;
  margin-bottom:10px;
  font-size:14px;
  font-weight:700;
  line-height:1.6;
}
.warning-box .ex{
  margin-top:8px;
  background:var(--card-bg);
  border-radius:8px;
  padding:8px 10px;
  font-size:13px;
  font-weight:600;
  color:var(--purple-dark);
}
.warning-box .ex b{color:var(--red);font-weight:800;}

/* 7. 비교문법 */
.compare-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
}
.compare-box h4{margin:0 0 8px;color:var(--purple-dark);font-size:15px;}
.compare-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.compare-table th{background:var(--card-bg);color:var(--purple-dark);padding:8px;text-align:left;}
.compare-table td{padding:8px;border-top:1px solid var(--border);}

/* 이전/다음 */
.nav-buttons{
  display:flex;
  gap:10px;
  padding:0 12px;
  margin-top:6px;
}
.nav-btn{
  flex:1;
  background:#fff;
  border:1.5px solid #d8cfc2;
  color:#000;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
  min-height:44px;
  cursor:pointer;
}
.nav-btn:disabled{opacity:.35;cursor:default;}

@media (min-width:640px){
  .stage{margin:0 20px 20px;padding:22px;}
  .nav-buttons{padding:0 20px;}
}
</style>
</head>
<body>

<div class="page-title">의사소통 한국어 6과 문법을 배워요</div>

<div class="gram-tabs" id="gramTabs"></div>
<div class="step-tabs" id="stepTabs"></div>
<div class="progress" id="progressLabel"></div>

<div class="stage" id="stage"></div>

<div class="nav-buttons">
  <button class="nav-btn" id="prevBtn">← 이전</button>
  <button class="nav-btn" id="nextBtn">다음 →</button>
</div>

<script>
const STEP_NAMES_MAIN = ["상황 도입","의미","형태","형태 연습","문장 연습","사용 시 주의점","비교 문법","말해 보세요"];
const STEP_NAMES_MORE = ["상황 도입","의미","형태","형태 연습","문장 연습","사용 시 주의점","비교 문법"];
function getStepNames(g){ return g.isMore ? STEP_NAMES_MORE : STEP_NAMES_MAIN; }

const grammarData = [
{
  tabLabel:"①A/V-는 데다가",
  title:"-는 데다가",
  sub:"-은/ㄴ 데다가",
  dialogue:[
    {s:"ga", t:"① 선영아, 난 축구 선수가 꿈인데 넌 장래 희망이 뭐야?"},
    {s:"na", t:"② 난 작가가 되고 싶어."},
    {s:"ga", t:"③ 작가? 그래. 넌 글도 잘 쓰<mark>는 데다가</mark> 상상력도 풍부하니까 훌륭한 작가가 될 거야."},
    {s:"na", t:"④ 고마워. 너도 뛰어난 축구 선수가 될 수 있을 거야."}
  ],
  meaning:{
    textbook:"내일은 비바람이 부<b>는 데다가</b> 기온까지 뚝 떨어진다고 하니까 옷 따뜻하게 입어.",
    daily:"나랑 와니는 나이가 같<b>은 데다가</b> 취향도 비슷해서 쉽게 친해졌어요.",
    summary:"✓ 앞의 내용에 뒤의 내용까지 더해짐을 나타내는 표현이에요."
  },
  forms:[
    {cond:"동사 (현재)", form:"-는 데다가", ex:"쓰다 → 쓰<b class='red'>는 데다가</b>"},
    {cond:"형용사", form:"-은/ㄴ 데다가", ex:"좋다 → 좋<b class='red'>은 데다가</b>"},
    {cond:"명사 + 인 데다가", form:"인 데다가", ex:"학생 → 학생<b class='red'>인 데다가</b>"}
  ],
  formPractice:[
    {word:"똑똑하다", answer:"똑똑한 데다가"},
    {word:"친절하다", answer:"친절한 데다가"},
    {word:"바쁘다", answer:"바쁜 데다가"},
    {word:"쓰다(글을)", answer:"쓰는 데다가"},
    {word:"넓다", answer:"넓은 데다가"}
  ],
  sentenceExample:"가: 요즘 이 휴대 전화가 그렇게 인기라면서?<br>나: 응. 가격이 저렴한 데다가 품질도 좋대. (가격이 저렴하다)",
  sentencePractice:[
    {q:"디자인이 독특하다", answer:"디자인이 독특한 데다가"},
    {q:"웬만해서는 고장이 안 나다", answer:"웬만해서는 고장이 안 나는 데다가"}
  ],
  talkMore:"여러분이 좋아하는 연예인은 누구예요? 왜 좋아해요?<br>'-는 데다가'를 사용하여 말해 보세요.",
  warnings:[
    {t:"⚠️ 앞뒤에는 비슷한 방향(둘 다 긍정적이거나 둘 다 부정적)의 내용이 오는 것이 자연스러워요.",
     ex:"예) 친절한 데다가 능력도 좋아요. (둘 다 긍정)"},
    {t:"⚠️ '-을 뿐만 아니라'와 의미가 비슷하지만 '-는 데다가'가 더 구어적이에요.",
     ex:"예) 맛있는 데다가 저렴해요. = 맛있을 뿐만 아니라 저렴해요."},
    {t:"⚠️ 앞의 특성에 대한 부가적인 정보를 추가할 때 사용해요."}
  ],
  compareTitle:"'-는 데다가' vs '-을 뿐만 아니라'",
  compareRows:[
    ["의미","앞 내용에 뒤의 내용이 덧붙여짐(구어적)","앞 내용에 더해 뒤 내용까지 작용함을 강조(격식적)"],
    ["예문1","이 카페는 조용한 데다가 커피도 맛있어요.","이 카페는 조용할 뿐만 아니라 커피도 맛있어요."],
    ["예문2","글을 잘 쓰는 데다가 상상력도 풍부해요.","글을 잘 쓸 뿐만 아니라 상상력도 풍부해요."]
  ],
  compareHead:["구분","-는 데다가","-을 뿐만 아니라"]
},
{
  tabLabel:"②V-든지",
  title:"-든지",
  sub:"-든지 -든지",
  dialogue:[
    {s:"ga", t:"① 이 필통을 네가 직접 만들었다고? 정말 예쁘다. 파는 물건이라고 해도 믿겠어."},
    {s:"na", t:"② 고마워. 주말에 심심해서 만들어 본 건데."},
    {s:"ga", t:"③ 넌 손재주가 정말 좋은 것 같아. 앞으로 방과 후 수업을 가<mark>든지</mark> 학원에 다니<mark>든지</mark> 해 봐. 전문적으로 배울 수 있게 말이야."},
    {s:"na", t:"④ 응. 안 그래도 그런 걸 가르쳐 주는 방과 후 수업이 있다고 해서 알아보려던 참이었어."}
  ],
  meaning:{
    textbook:"상담실에 가서 진로 상담을 받<b>든지</b> 적성 검사를 하<b>든지</b> 해야겠어.",
    daily:"졸리면 잠깐 자<b>든지</b> 세수를 하<b>든지</b> 해.",
    summary:"✓ 여러 가지 중에서 어느 것을 선택해도 상관없음을 나타내는 표현이에요."
  },
  forms:[
    {cond:"동사·형용사 (받침 유무 상관없이)", form:"-든지 -든지", ex:"가다/오다 → 가<b class='red'>든지</b> 오<b class='red'>든지</b>"},
    {cond:"의문사 + -든지", form:"무엇이든지, 언제든지", ex:"무엇 → 무엇<b class='red'>이든지</b>"}
  ],
  formPractice:[
    {word:"먹다/마시다", answer:"먹든지 마시든지"},
    {word:"가다/오다", answer:"가든지 오든지"},
    {word:"쉬다/놀다", answer:"쉬든지 놀든지"},
    {word:"보다/듣다", answer:"보든지 듣든지"},
    {word:"자다/공부하다", answer:"자든지 공부하든지"}
  ],
  sentenceExample:"그 운동화가 마음에 안 들면 교환하든지 반품하든지 해. (교환하다, 반품하다)",
  sentencePractice:[
    {q:"여행을 가다, 자격증 시험을 준비하다", answer:"여행을 가든지 자격증 시험을 준비하든지"},
    {q:"소리를 줄이다, 끄다", answer:"소리를 줄이든지 끄든지"}
  ],
  talkMore:"친구에게 두 가지 일 중에서 하나를 선택하도록 조언해요.<br>'-든지'를 사용하여 말해 보세요.",
  warnings:[

let curGram = 0, curStep = 0;

function renderGramTabs(){
  const wrap = document.getElementById('gramTabs');
  wrap.innerHTML = grammarData.map((g,i)=>
    `<div class="gram-tab ${g.isMore?'more':''} ${i===curGram?'active':''}" data-i="${i}">${g.tabLabel}</div>`
  ).join('');
  wrap.querySelectorAll('.gram-tab').forEach(el=>{
    el.addEventListener('click', ()=>{ curGram = +el.dataset.i; curStep = 0; renderAll(); });
  });
  const active = wrap.querySelector('.gram-tab.active');
  if(active) active.scrollIntoView({inline:'center', behavior:'smooth', block:'nearest'});
}

function renderStepTabs(){
  const g = grammarData[curGram];
  const names = getStepNames(g);
  const wrap = document.getElementById('stepTabs');
  wrap.innerHTML = names.map((n,i)=>
    `<div class="step-tab ${i===curStep?'active':''}" data-i="${i}">${i+1}. ${n}</div>`
  ).join('');
  wrap.querySelectorAll('.step-tab').forEach(el=>{
    el.addEventListener('click', ()=>{ curStep = +el.dataset.i; renderAll(); });
  });
  const active = wrap.querySelector('.step-tab.active');
  if(active) active.scrollIntoView({inline:'center', behavior:'smooth', block:'nearest'});
}

function renderProgress(){
  const total = getStepNames(grammarData[curGram]).length;
  document.getElementById('progressLabel').textContent = `문법 ${curGram+1} · ${curStep+1}/${total}`;
}

function practiceListHTML(items){
  return items.map((it,idx)=>`
    <div class="practice-item" data-idx="${idx}">
      <div class="q">${it.word ? it.word : it.q} <span class="answer-text">→ ${it.answer}</span></div>
      <button class="btn-answer">정답 보기</button>
    </div>
  `).join('') + `<button class="btn-retry">다시 풀기</button>`;
}

function renderStage(){
  const g = grammarData[curGram];
  const stage = document.getElementById('stage');
  let html = `<div class="grammar-title-box"><span class="main jua">${g.title}</span><span class="sub">${g.sub}</span></div>`;

  const stepName = getStepNames(g)[curStep];

  if(stepName==="상황 도입"){
    html += `<div class="dialogue">` + g.dialogue.map(d=>
      `<div class="bubble-row ${d.s}"><div class="bubble">${d.t}</div></div>`
    ).join('') + `</div>`;
    html += `<div class="intro-hint">💡 <span class="chip">${g.title}</span>가 어디에 쓰였는지 찾아보세요!</div>`;
  }
  else if(stepName==="의미"){
    html += `<div class="ex-box"><span class="ex-tag">교재 예문</span><p>${g.meaning.textbook}</p></div>`;
    html += `<div class="ex-box"><span class="ex-tag">일상 예문</span><p>${g.meaning.daily}</p></div>`;
    html += `<div class="summary-box">${g.meaning.summary}</div>`;
  }
  else if(stepName==="형태"){
    html += `<div class="table-wrap"><table class="form-table"><tr><th>조건</th><th>형태</th><th>예시</th></tr>`
      + g.forms.map(f=>`<tr><td>${f.cond}</td><td class="form-col">${f.form}</td><td>${f.ex}</td></tr>`).join('')
      + `</table></div>`;
  }
  else if(stepName==="형태 연습"){
    html += `<div class="hint-bar">💡 단어를 클릭하면 답이 나타나요.</div>`;
    html += practiceListHTML(g.formPractice);
  }
  else if(stepName==="문장 연습"){
    html += `<div class="example-box"><span class="tag-bogi">보기</span>${g.sentenceExample}</div>`;
    html += practiceListHTML(g.sentencePractice);
  }
  else if(stepName==="말해 보세요"){
    html += `<div class="talk-more-page">${g.talkMore}</div>`;
  }
  else if(stepName==="사용 시 주의점"){
    html += g.warnings.map(w=>`<div class="warning-box">${w.t}<div class="ex">${w.ex}</div></div>`).join('');
  }
  else if(stepName==="비교 문법"){
    html += `<div class="compare-box"><h4>${g.compareTitle}</h4>
      <table class="compare-table"><tr>${g.compareHead.map(h=>`<th>${h}</th>`).join('')}</tr>
      ${g.compareRows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
      </table></div>`;
  }

  stage.innerHTML = html;

  stage.querySelectorAll('.btn-answer').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.closest('.practice-item').classList.add('revealed');
    });
  });
  const retry = stage.querySelector('.btn-retry');
  if(retry){
    retry.addEventListener('click', ()=>{
      stage.querySelectorAll('.practice-item').forEach(it=>it.classList.remove('revealed'));
    });
  }
}

function renderNav(){
  const total = getStepNames(grammarData[curGram]).length;
  document.getElementById('prevBtn').disabled = (curGram===0 && curStep===0);
  document.getElementById('nextBtn').disabled = (curGram===grammarData.length-1 && curStep===total-1);
}

function renderAll(){
  renderGramTabs();
  renderStepTabs();
  renderProgress();
  renderStage();
  renderNav();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(curStep>0){ curStep--; }
  else if(curGram>0){ curGram--; curStep = getStepNames(grammarData[curGram]).length - 1; }
  renderAll();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  const total = getStepNames(grammarData[curGram]).length;
  if(curStep<total-1){ curStep++; }
  else if(curGram<grammarData.length-1){ curGram++; curStep=0; }
  renderAll();
});

renderAll();
</script>
</body>
</html>
