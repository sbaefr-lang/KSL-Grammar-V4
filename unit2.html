<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>의사소통 한국어 2과 문법을 배워요</title>

<meta property="og:title" content="의사소통 한국어 2과 문법을 배워요">
<meta property="og:description" content="화재 시에는 문을 함부로 연다거나 엘리베이터를 타면 안 된대 - 문법 6개를 인터랙티브로 배워요">
<meta property="og:image" content="https://sbaefr-lang.github.io/KSL-Grammar-V2/assets/banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://sbaefr-lang.github.io/KSL-Grammar-V2/assets/banner.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Jua&display=swap" rel="stylesheet">

<style>
:root{
  --purple-main:#8b6fc9;
  --purple-dark:#5a3d99;
  --bg:#f7f4fc;
  --card-bg:#efe7fa;
  --ink:#2c3438;
  --border:#ded0f0;
  --ga-bg:#ece4fb;
  --ga-border:#cdb8ec;
  --na-bg:#f8ecf7;
  --na-border:#e3b9dc;
  --highlight:#fff1a6;
  --red:#d1495b;
  --white:#ffffff;
  --more-main:#e2a154;
  --more-bg:#fdf1e0;
  --more-dark:#8a5a1e;
  --more-border:#f0d9b0;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  background-image:radial-gradient(circle at 1px 1px, #e6dbf6 1px, transparent 0);
  background-size:22px 22px;
  font-family:'Gothic A1',sans-serif;
  color:var(--ink);
  padding-bottom:90px;
}
.jua{font-family:'Jua',sans-serif;}

/* 타이틀 */
.page-title{
  text-align:center;
  font-size:15px;
  font-weight:700;
  color:#000;
  padding:14px 10px 6px;
}

/* 상단 문법 탭 (책갈피) */
.gram-tabs{
  display:flex;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:0 8px;
  gap:5px;
}
.gram-tabs::-webkit-scrollbar{display:none;}
.gram-tab{
  flex:0 0 auto;
  padding:12px 16px;
  min-height:44px;
  display:flex;
  align-items:center;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  background:var(--purple-main);
  color:#fff;
  border:1px solid var(--purple-main);
  border-radius:14px 14px 0 0;
  cursor:pointer;
  transition:.15s;
}
.gram-tab.active{
  background:var(--card-bg);
  color:var(--purple-dark);
  border-color:var(--border);
}
/* 더 배워요 탭 (다른 색상으로 구분) */
.gram-tab.more{
  background:var(--more-main);
  border-color:var(--more-main);
}
.gram-tab.more.active{
  background:var(--more-bg);
  color:var(--more-dark);
  border-color:var(--more-border);
}

/* 하위 단계 탭 */
.step-tabs{
  display:flex;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  gap:6px;
  padding:10px 10px 0;
  background:var(--card-bg);
}
.step-tabs::-webkit-scrollbar{display:none;}
.step-tab{
  flex:0 0 auto;
  padding:9px 13px;
  min-height:40px;
  display:flex;
  align-items:center;
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
  background:#fff;
  color:#000;
  border:1px solid var(--border);
  border-radius:8px 8px 0 0;
  cursor:pointer;
}
.step-tab.active{
  background:#242229;
  color:#fff;
  border-color:#242229;
}

.progress{
  text-align:center;
  font-size:12px;
  color:var(--purple-dark);
  font-weight:700;
  background:var(--card-bg);
  padding:4px 0 10px;
}

/* 컨텐츠 영역 */
.stage{
  background:var(--card-bg);
  padding:16px 14px 26px;
  border-radius:0 0 14px 14px;
  margin:0 6px 20px;
}
.panel{display:none;animation:fade .25s;}
.panel.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.grammar-title-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:14px;
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.grammar-title-box .main{
  font-size:20px;
  font-weight:800;
  color:var(--purple-dark);
}
.grammar-title-box .sub{
  font-size:13px;
  color:#6b6b6b;
  font-weight:500;
}

/* 1. 상황 도입 - 대화 */
.dialogue{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.bubble-row{display:flex;}
.bubble-row.ga{justify-content:flex-start;}
.bubble-row.na{justify-content:flex-end;}
.bubble{
  max-width:82%;
  padding:11px 14px;
  border-radius:16px;
  font-size:14.5px;
  line-height:1.5;
  color:#000;
  font-weight:500;
}
.bubble-row.ga .bubble{background:var(--ga-bg);border:1px solid var(--ga-border);border-bottom-left-radius:4px;}
.bubble-row.na .bubble{background:var(--na-bg);border:1px solid var(--na-border);border-bottom-right-radius:4px;}
.bubble mark{
  background:var(--highlight);
  font-weight:800;
  padding:0 2px;
  border-radius:3px;
}
.intro-hint{
  display:flex;
  align-items:center;
  gap:6px;
  justify-content:center;
  background:#fff;
  border:1.5px solid var(--purple-main);
  border-radius:999px;
  padding:10px 16px;
  font-size:13.5px;
  font-weight:600;
  margin-top:6px;
  flex-wrap:wrap;
  text-align:center;
}
.chip{
  background:var(--purple-dark);
  color:#fff;
  padding:2px 10px;
  border-radius:999px;
  font-weight:800;
  font-size:13px;
}

/* 2. 의미 */
.ex-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
  position:relative;
}
.ex-tag{
  display:inline-block;
  background:var(--card-bg);
  color:var(--purple-dark);
  border:1px solid var(--border);
  font-size:11.5px;
  font-weight:700;
  padding:3px 10px;
  border-radius:999px;
  margin-bottom:8px;
}
.ex-box p{margin:0;font-size:14.5px;line-height:1.6;}
.ex-box b{color:var(--purple-dark);font-weight:800;}
.summary-box{
  background:var(--card-bg);
  border-radius:10px;
  padding:12px 14px;
  font-size:14px;
  font-weight:700;
  color:var(--purple-dark);
  margin-top:14px;
}

/* 3. 형태 표 */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--border);}
table.form-table{width:100%;border-collapse:collapse;background:#fff;min-width:480px;}
table.form-table th{
  background:var(--purple-main);
  color:#fff;
  font-size:13.5px;
  padding:10px 8px;
  text-align:left;
  white-space:nowrap;
}
table.form-table td{
  padding:12px 10px;
  font-size:14px;
  border-top:1px solid var(--border);
  vertical-align:top;
}
table.form-table td.form-col{color:#000;font-weight:700;}
table.form-table b.red{color:var(--red);font-weight:800;}

/* 4,5. 연습 리스트 */
.hint-bar{
  background:var(--card-bg);
  color:var(--purple-dark);
  font-weight:700;
  font-size:13.5px;
  padding:10px 14px;
  border-radius:10px;
  margin-bottom:12px;
}
.example-box{
  background:var(--card-bg);
  border-radius:12px;
  padding:14px;
  margin-bottom:14px;
  font-size:14.5px;
  font-weight:700;
  line-height:1.6;
  position:relative;
  padding-top:30px;
}
.example-box .tag-bogi{
  position:absolute;
  top:-10px;left:14px;
  background:#fff;
  border:1px solid var(--border);
  padding:3px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  color:var(--purple-dark);
}
.practice-item{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.practice-item .q{font-size:14.5px;font-weight:600;flex:1;min-width:150px;}
.practice-item .q .answer-text{
  display:none;
  color:var(--purple-dark);
  font-weight:800;
  margin-left:4px;
}
.practice-item.revealed .q .answer-text{display:inline;}
.btn-answer{
  background:var(--purple-main);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:10px 16px;
  font-size:13.5px;
  font-weight:700;
  min-height:44px;
  cursor:pointer;
  white-space:nowrap;
}
.practice-item.revealed .btn-answer{background:var(--card-bg);color:var(--purple-dark);}
.btn-retry{
  display:block;
  width:100%;
  background:#fff;
  border:1.5px solid #000;
  color:#000;
  border-radius:10px;
  padding:12px;
  font-size:14px;
  font-weight:700;
  min-height:44px;
  cursor:pointer;
  margin-top:6px;
}
.talk-more{
  margin-top:16px;
  background:var(--card-bg);
  border-radius:12px;
  padding:14px;
  font-size:13.5px;
  font-weight:700;
  color:var(--purple-dark);
  text-align:center;
  line-height:1.6;
}
.talk-more-page{
  margin-top:4px;
  background:var(--card-bg);
  border-radius:14px;
  padding:22px 18px;
  font-size:15px;
  font-weight:700;
  color:var(--purple-dark);
  text-align:center;
  line-height:1.8;
}

/* 6. 사용 시 주의점 */
.warning-box{
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:13px 14px;
  margin-bottom:10px;
  font-size:14px;
  font-weight:700;
  line-height:1.6;
}
.warning-box .ex{
  margin-top:8px;
  background:var(--card-bg);
  border-radius:8px;
  padding:8px 10px;
  font-size:13px;
  font-weight:600;
  color:var(--purple-dark);
}
.warning-box .ex b{color:var(--red);font-weight:800;}

/* 7. 비교문법 */
.compare-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
}
.compare-box h4{margin:0 0 8px;color:var(--purple-dark);font-size:15px;}
.compare-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.compare-table th{background:var(--card-bg);color:var(--purple-dark);padding:8px;text-align:left;}
.compare-table td{padding:8px;border-top:1px solid var(--border);}

/* 이전/다음 */
.nav-buttons{
  display:flex;
  gap:10px;
  padding:0 12px;
  margin-top:6px;
}
.nav-btn{
  flex:1;
  background:#fff;
  border:1.5px solid #d8cfc2;
  color:#000;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
  min-height:44px;
  cursor:pointer;
}
.nav-btn:disabled{opacity:.35;cursor:default;}

@media (min-width:640px){
  .stage{margin:0 20px 20px;padding:22px;}
  .nav-buttons{padding:0 20px;}
}
</style>
</head>
<body>

<div class="page-title">의사소통 한국어 2과 문법을 배워요</div>

<div class="gram-tabs" id="gramTabs"></div>
<div class="step-tabs" id="stepTabs"></div>
<div class="progress" id="progressLabel"></div>

<div class="stage" id="stage"></div>

<div class="nav-buttons">
  <button class="nav-btn" id="prevBtn">← 이전</button>
  <button class="nav-btn" id="nextBtn">다음 →</button>
</div>

<script>
const STEP_NAMES_MAIN = ["상황 도입","의미","형태","형태 연습","문장 연습","사용 시 주의점","비교 문법","말해 보세요"];
const STEP_NAMES_MORE = ["상황 도입","의미","형태","형태 연습","문장 연습","사용 시 주의점","비교 문법"];
function getStepNames(g){ return g.isMore ? STEP_NAMES_MORE : STEP_NAMES_MAIN; }

const grammarData = [
{
  tabLabel:"①V-는다거나",
  title:"-는다거나",
  sub:"-ㄴ다거나, -다거나",
  dialogue:[
    {s:"ga", t:"① 영수야, 뭐 보고 있어?"},
    {s:"na", t:"② 선생님이 나눠 주신 화재 대피 방법 설명서를 읽고 있어. 알고 있어야 할 것 같아서."},
    {s:"ga", t:"③ 그래? 불이 나면 어떻게 해야 된대?"},
    {s:"na", t:"④ 화재 시에는 문을 함부로 연<mark>다거나</mark> 엘리베이터를 타면 안 된대. 계단으로 대피해야 한대."}
  ],
  meaning:{
    textbook:"남이 발표할 때 웃<b>는다거나</b> 떠든<b>다거나</b> 하면 발표에 방해가 돼요.",
    daily:"머리가 아프<b>다거나</b> 열이 나<b>다거나</b> 하면 약을 드세요.",
    summary:"✓ 여러 가지 행위를 예로 들어 나열하면서 설명할 때 쓰는 표현이에요."
  },
  forms:[
    {cond:"받침 있는 동사", form:"-는다거나", ex:"먹다 → 먹<b class='red'>는다거나</b>"},
    {cond:"받침 없는 동사", form:"-ㄴ다거나", ex:"가다 → 가<b class='red'>ㄴ다거나</b>"},
    {cond:"형용사·이다", form:"-다거나", ex:"조용하다 → 조용하<b class='red'>다거나</b>"}
  ],
  formPractice:[
    {word:"웃다", answer:"웃는다거나"},
    {word:"떠들다", answer:"떠든다거나"},
    {word:"자다", answer:"잔다거나"},
    {word:"걷다", answer:"걷는다거나"},
    {word:"놀다", answer:"논다거나"}
  ],
  sentenceExample:"숙제를 안 한다거나 지각을 한다거나 하면 선생님께 혼나요. (숙제를 안 하다)",
  sentencePractice:[
    {q:"(교실에서 뛰다) 다른 친구와 부딪힐 수 있어요.", answer:"교실에서 뛴다거나"},
    {q:"(거짓말을 하다) 하면 친구를 잃을 수 있어요.", answer:"거짓말을 한다거나"}
  ],
  talkMore:"여러분은 무슨 일들을 할 때 보람을 느껴요?<br>'-는다거나'를 사용하여 말해 보세요.",
  warnings:[
    {t:"⚠️ 두 가지 이상의 행위를 예로 들 때 사용하며, 보통 뒤에 '하다'가 이어져요.",
     ex:"예) 뛰어다닌다거나 소리를 지른다거나 하면 안 돼요."},
    {t:"⚠️ 한 가지 행위만 말할 때는 자연스럽지 않아요. 두 개 이상 나열할 때 사용해요.",
     ex:"예) 문을 연다거나. (X) → 문을 연다거나 창문을 연다거나 하면 안 돼요. (O)"},
    {t:"⚠️ 실제로 일어난 일이 아니라 예시로 드는 행동이므로, 이미 있었던 일을 설명할 때는 사용하지 않아요.",
     ex:"예) 어제 뛴다거나 걷는다거나 했어요. (X) → 어제 뛰거나 걸었어요. (O)"}
  ],
  compareTitle:"'-는다거나' vs '-거나'",
  compareRows:[
    ["의미","여러 행위를 예로 들어 나열함","둘 중 하나를 선택하거나 단순히 나열함"],
    ["예문1","떠든다거나 뛴다거나 하면 안 돼요. (여러 예시)","버스나 지하철을 타고 가요. (둘 중 선택)"],
    ["예문2","숙제를 안 한다거나 지각한다거나 하면 혼나요.","공부하거나 쉬거나 마음대로 하세요."]
  ],
  compareHead:["구분","-는다거나","-거나"]
},
{
  tabLabel:"②피동 표현",
  title:"피동 표현",
  sub:"-이/히/리/기-, -아/어지다",
  dialogue:[
    {s:"ga", t:"① 태풍 때문에 오늘 밤부터 비가 많이 온대요. 청소 당번은 복도 창문이 잘 닫혀 있는지 확인했어요?"},
    {s:"na", t:"② 네, 선생님. 다 <mark>확인했어요</mark>."},
    {s:"ga", t:"③ 그리고 여러분, 내일 학교에 올 때 비가 안 와도 우산 꼭 챙겨 오세요."},
    {s:"na", t:"④ 네, 알겠습니다."}
  ],
  meaning:{
    textbook:"수호가 모기에 <b>물렸어요</b>.",
    daily:"창문이 저절로 <b>열려</b> 있었어요.",
    summary:"✓ 주어의 의지와 상관없이 외부적인 영향으로 상황이 변화함을 나타내는 표현이에요."
  },
  forms:[
    {cond:"동사 어간 + 이/히/리/기", form:"피동 접미사", ex:"먹다 → 먹<b class='red'>히</b>다"},
    {cond:"동사 어간 + -아/어지다", form:"-아/어지다", ex:"끊다 → 끊<b class='red'>어지다</b>"},
    {cond:"이미 피동 의미인 동사", form:"그대로 사용", ex:"열리다, 물리다, 잠기다 등"}
  ],
  formPractice:[
    {word:"열다", answer:"열리다"},
    {word:"물다", answer:"물리다"},
    {word:"끊다", answer:"끊어지다"},
    {word:"잠그다", answer:"잠기다"},
    {word:"닫다", answer:"닫히다"}
  ],
  sentenceExample:"바람 때문에 창문이 저절로 닫혔어요. (창문을 닫다)",
  sentencePractice:[
    {q:"(문을 잠그다) 아무도 없는데 저절로요.", answer:"문이 잠겼어요"},
    {q:"(모기가 물다) 팔이 너무 가려워요.", answer:"모기한테 물렸어요"}
  ],
  talkMore:"지진이 나면 어떤 일이 생겨요?<br>'피동 표현'을 사용하여 말해 보세요.",
  warnings:[

let curGram = 0, curStep = 0;

function renderGramTabs(){
  const wrap = document.getElementById('gramTabs');
  wrap.innerHTML = grammarData.map((g,i)=>
    `<div class="gram-tab ${g.isMore?'more':''} ${i===curGram?'active':''}" data-i="${i}">${g.tabLabel}</div>`
  ).join('');
  wrap.querySelectorAll('.gram-tab').forEach(el=>{
    el.addEventListener('click', ()=>{ curGram = +el.dataset.i; curStep = 0; renderAll(); });
  });
  const active = wrap.querySelector('.gram-tab.active');
  if(active) active.scrollIntoView({inline:'center', behavior:'smooth', block:'nearest'});
}

function renderStepTabs(){
  const g = grammarData[curGram];
  const names = getStepNames(g);
  const wrap = document.getElementById('stepTabs');
  wrap.innerHTML = names.map((n,i)=>
    `<div class="step-tab ${i===curStep?'active':''}" data-i="${i}">${i+1}. ${n}</div>`
  ).join('');
  wrap.querySelectorAll('.step-tab').forEach(el=>{
    el.addEventListener('click', ()=>{ curStep = +el.dataset.i; renderAll(); });
  });
  const active = wrap.querySelector('.step-tab.active');
  if(active) active.scrollIntoView({inline:'center', behavior:'smooth', block:'nearest'});
}

function renderProgress(){
  const total = getStepNames(grammarData[curGram]).length;
  document.getElementById('progressLabel').textContent = `문법 ${curGram+1} · ${curStep+1}/${total}`;
}

function practiceListHTML(items){
  return items.map((it,idx)=>`
    <div class="practice-item" data-idx="${idx}">
      <div class="q">${it.word ? it.word : it.q} <span class="answer-text">→ ${it.answer}</span></div>
      <button class="btn-answer">정답 보기</button>
    </div>
  `).join('') + `<button class="btn-retry">다시 풀기</button>`;
}

function renderStage(){
  const g = grammarData[curGram];
  const stage = document.getElementById('stage');
  let html = `<div class="grammar-title-box"><span class="main jua">${g.title}</span><span class="sub">${g.sub}</span></div>`;

  const stepName = getStepNames(g)[curStep];

  if(stepName==="상황 도입"){
    html += `<div class="dialogue">` + g.dialogue.map(d=>
      `<div class="bubble-row ${d.s}"><div class="bubble">${d.t}</div></div>`
    ).join('') + `</div>`;
    html += `<div class="intro-hint">💡 <span class="chip">${g.title}</span>가 어디에 쓰였는지 찾아보세요!</div>`;
  }
  else if(stepName==="의미"){
    html += `<div class="ex-box"><span class="ex-tag">교재 예문</span><p>${g.meaning.textbook}</p></div>`;
    html += `<div class="ex-box"><span class="ex-tag">일상 예문</span><p>${g.meaning.daily}</p></div>`;
    html += `<div class="summary-box">${g.meaning.summary}</div>`;
  }
  else if(stepName==="형태"){
    html += `<div class="table-wrap"><table class="form-table"><tr><th>조건</th><th>형태</th><th>예시</th></tr>`
      + g.forms.map(f=>`<tr><td>${f.cond}</td><td class="form-col">${f.form}</td><td>${f.ex}</td></tr>`).join('')
      + `</table></div>`;
  }
  else if(stepName==="형태 연습"){
    html += `<div class="hint-bar">💡 단어를 클릭하면 답이 나타나요.</div>`;
    html += practiceListHTML(g.formPractice);
  }
  else if(stepName==="문장 연습"){
    html += `<div class="example-box"><span class="tag-bogi">보기</span>${g.sentenceExample}</div>`;
    html += practiceListHTML(g.sentencePractice);
  }
  else if(stepName==="말해 보세요"){
    html += `<div class="talk-more-page">${g.talkMore}</div>`;
  }
  else if(stepName==="사용 시 주의점"){
    html += g.warnings.map(w=>`<div class="warning-box">${w.t}<div class="ex">${w.ex}</div></div>`).join('');
  }
  else if(stepName==="비교 문법"){
    html += `<div class="compare-box"><h4>${g.compareTitle}</h4>
      <table class="compare-table"><tr>${g.compareHead.map(h=>`<th>${h}</th>`).join('')}</tr>
      ${g.compareRows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
      </table></div>`;
  }

  stage.innerHTML = html;

  stage.querySelectorAll('.btn-answer').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.closest('.practice-item').classList.add('revealed');
    });
  });
  const retry = stage.querySelector('.btn-retry');
  if(retry){
    retry.addEventListener('click', ()=>{
      stage.querySelectorAll('.practice-item').forEach(it=>it.classList.remove('revealed'));
    });
  }
}

function renderNav(){
  const total = getStepNames(grammarData[curGram]).length;
  document.getElementById('prevBtn').disabled = (curGram===0 && curStep===0);
  document.getElementById('nextBtn').disabled = (curGram===grammarData.length-1 && curStep===total-1);
}

function renderAll(){
  renderGramTabs();
  renderStepTabs();
  renderProgress();
  renderStage();
  renderNav();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(curStep>0){ curStep--; }
  else if(curGram>0){ curGram--; curStep = getStepNames(grammarData[curGram]).length - 1; }
  renderAll();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  const total = getStepNames(grammarData[curGram]).length;
  if(curStep<total-1){ curStep++; }
  else if(curGram<grammarData.length-1){ curGram++; curStep=0; }
  renderAll();
});

renderAll();
</script>
</body>
</html>
